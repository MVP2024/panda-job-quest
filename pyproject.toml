[tool.poetry]
name = "pandajobquest"
version = "0.1.0"
description = "PandaJobQuest: Ваш персональный навигатор в мире карьерных возможностей..."
authors = ["Valery Medvedev <walery.medvedev@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [
    { include = "api" },
    { include = "models" },
    { include = "storage" },
    { include = "tests" }
]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.32.3"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^4.1.0"
mypy = "^1.8.0"
flake8 = "^7.0.0"
black = "^24.2.0"
isort = "^5.13.0"
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true

[tool.coverage.run]
source = ["api", "models", "storage", "parsers"]
omit = [
    "tests/*",
    "*/__init__.py",
    "main.py"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=term-missing"
norecursedirs = [
    "main.py",
    "venv"
]
